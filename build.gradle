buildscript
{
    repositories
    {
        maven
        {
            url = 'https://maven.minecraftforge.net/'
        }
        mavenCentral()
    }

    dependencies
    {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'

apply plugin: 'eclipse'
apply plugin: 'maven-publish'

// File metadata
version = '0.1'
group = 'org.imesense.boilerplatemcforge.modid'
archivesBaseName = 'boilerplatemcforge'

// Java version
sourceCompatibility =
targetCompatibility =
compileJava.sourceCompatibility =
compileJava.targetCompatibility =
    '1.8'

minecraft
{
    // Mappings settings of Minecraft
    mappings channel: 'snapshot', version: '20171003-1.12'

    // Uncomment this to disable `Srg` named sources JAR by default
    //makeObfSourceJar = false

    //accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations
    runs
    {
        client
        {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }

        server
        {
            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }
    }
}

dependencies
{
    // Specify the version of Minecraft to use
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'

    // Optional dependencies that exist at compile-time but might not at runtime
    //provided 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // Dependencies to get remapped to current MCP mappings
    //deobf 'com.mod-buildcraft:buildcraft:6.0.8:dev'
}

// Get properties into the manifest for reading by the runtime
jar
{
    manifest
    {
        attributes([
            "Specification-Title": "boilerplatemcforge",
            "Specification-Vendor": "imesense",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"imesense",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Preferred method to reobfuscate JAR file
jar.finalizedBy('reobfJar')

// Build sources task
tasks.register('sourcesJar', Jar)
{
    from sourceSets.main.allJava
    from sourceSets.main.resources
    classifier = 'sources'
}

// Build documentation task
tasks.register('javadocJar', Jar)
{
    dependsOn javadoc
    from "$buildDir/docs/javadoc"
    classifier = 'javadoc'
}

// Build additional artifacts
artifacts
{
    archives sourcesJar
    archives javadocJar
}

// Delay the obfuscation
//publish.dependsOn('reobfJar')

// Set publish settings
publishing
{
    publications
    {
        mavenJava(MavenPublication)
        {
            artifact jar
            artifact sourcesJar
            artifact javadocJar
        }
    }

    repositories
    {
        maven
        {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

// Enable packaging of metadata and resources
sourceSets
{
    main
    {
        output.resourcesDir = output.classesDir
    }
}
