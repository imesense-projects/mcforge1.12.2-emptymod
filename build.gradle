plugins {
    id 'java'

    id 'eclipse'
    id 'idea'

    id 'net.minecraftforge.gradle' version "6.0.+"
    id 'org.spongepowered.mixin' version "0.7.+"
    id 'wtf.gofancy.fancygradle' version "1.1.+"
}

repositories {
    flatDir {
        dirs 'libs'
    }
    maven {
        url "https://cursemaven.com"
    }
}

apply plugin: 'maven-publish'

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

// File metadata
version = '1.12.2-0.2'
group = 'org.imesense'
base.archivesName = 'EmptyMod'

// Java version
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// Compile options
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:-options']
}

minecraft {
    // Mappings settings of Minecraft
    mappings channel: 'stable', version: '39-1.12'

    // Default run configurations
    runs {
        client {
            args "--username=InDev"

            jvmArg "-Dfml.coreMods.load=org.imesense.emptymod.plugin.LoadingPlugin"
            jvmArg "-Dmixin.hotSwap=true"
            jvmArg "-Dmixin.checks.interfaces=true"

            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }

        server {
            jvmArg "-Dfml.coreMods.load=org.imesense.emptymod.plugin.LoadingPlugin"
            jvmArg "-Dmixin.hotSwap=true"
            jvmArg "-Dmixin.checks.interfaces=true"

            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }
    }
}

mixin {
    add sourceSets.main, 'mixins.emptymod.refmap.json'
}

dependencies {
    // Specify the version of Minecraft to use
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2864'

    // Mixins
    compileOnly "org.spongepowered:mixin:0.8.7"
    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.0"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.0"
    implementation fg.deobf("curse.maven:fermiumbooter-968474:7279112")

    // Just Enough Item
    implementation fg.deobf("curse.maven:jei-238222:5846804")

    // Lombok
    //compileOnly 'org.projectlombok:lombok:1.18.30'
    //annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Byte Buddy
    testImplementation('net.bytebuddy:byte-buddy:1.12.9') {
        transitive = false
    }

    // JUnit
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'

    // Mockito
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:4.11.0'
    testImplementation 'org.mockito:mockito-inline:4.11.0'

    // Mixins
    testImplementation 'org.spongepowered:mixin:0.8.5'
}

test {
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed"
    }
}

fancyGradle {
    patches {
        resources
        coremods
        asm
        mergetool
    }
}

// Get properties into the manifest for reading by the runtime
jar {
    manifest {
        def attribute = [:]
        attribute['Specification-Title'] = 'emptymod'
        attribute['Specification-Vendor'] = 'imesense'
        attribute['Specification-Version'] = '1'
        attribute['Implementation-Title'] = project.name
        attribute['Implementation-Vendor'] = 'imesense'
        attribute['Implementation-Version'] = '${version}'
        attribute['Implementation-Timestamp'] = new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        attribute['FMLCorePlugin'] = 'org.imesense.emptymod.plugin.LoadingPlugin'
        attribute['FMLCorePluginContainsFMLMod'] = 'true'
        attribute['TweakClass'] = 'org.spongepowered.asm.launch.MixinTweaker'
        attribute['ForceLoadAsMod'] = "true"

        def currentTasks = gradle.startParameter.taskNames
        if (currentTasks[0] == 'build' || currentTasks[0] == 'assemble') {
            attribute['ForceLoadAsMod'] = "true"
        }

        attributes(attribute)
    }
}

// Preferred method to reobfuscate JAR file
jar.finalizedBy('reobfJar')

// Build sources task
tasks.register('sourcesJar', Jar) {
    dependsOn processResources
    from sourceSets.main.allSource
    archiveClassifier = 'sources'
}

// Build documentation task
tasks.register('javadocJar', Jar) {
    dependsOn javadoc
    from "$buildDir/docs/javadoc"
    archiveClassifier = 'javadoc'
}

// Delay the obfuscation
//publish.dependsOn('reobfJar')

// Set publish settings
publishing {
    publications {
        mavenJava(MavenPublication) {
            // Redefine output name
            artifactId = "emptymod"

            artifact jar
            artifact sourcesJar
            artifact javadocJar

            // Add dependencies to manifest
            pom.withXml {
                def dependenciesNode = asNode().appendNode('dependencies')
                configurations.runtimeClasspath.allDependencies.each { dep ->
                    if (dep.group != null && dep.name != null) {
                        def dependencyNode = dependenciesNode.appendNode('dependency')
                        dependencyNode.appendNode('groupId', dep.group)
                        dependencyNode.appendNode('artifactId', dep.name)
                        dependencyNode.appendNode('version', dep.version)
                    }
                }
            }
        }
    }

    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.register('copyDependencies', Copy) {
    from configurations.runtimeClasspath.filter {
        file ->
            file.name.contains('fermiumbooter')
    }
    into 'run/mods'
}

jar.dependsOn copyDependencies
build.dependsOn copyDependencies
