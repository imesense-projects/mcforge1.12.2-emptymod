# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/a08f8d51631b7127ddac3d2c65537db429d0f1d0/schema/compose-spec.json

services:
    emptymod-devcontainer:
        container_name: emptymod-devcontainer

        build:
            dockerfile: .devcontainer/Dockerfile
            context: ..
            args:
                DEBIAN_VARIANT: "bullseye"
                JAVA_VERSION: "1-8"

        user: minecraft
        working_dir: /src
        volumes:
            - ..:/src:delegated
            - ../.gradle:/gradle:delegated

        networks:
            - emptymod-devcontainer

        command: ["tail", "-f", "/dev/null"]

networks:
    emptymod-devcontainer:
        driver: bridge
