# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:
    boilerplatemcforge-server:
        container_name: boilerplatemcforge-server
        platform: linux/amd64
        build:
            context: ../..
            dockerfile: docker/Server/Dockerfile
            target: final
        profiles:
            - server
        environment:
            - EULA=true
        ports:
            - "25565:25565"
        volumes:
            - ../../world:/app/world
            - ../../config:/app/config
            - ../../crash-reports:/app/crash-reports
            - ../../server.properties:/app/server.properties
        networks:
            - boilerplatemcforge-network
        restart: unless-stopped

networks:
    boilerplatemcforge-network:
        name: boilerplatemcforge-network
        driver: bridge
